<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Привет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #07070b; }
  body {
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #f2f2f7;
  }
  /* тёмный фон с размытыми пятнами */
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
  .b1 { width: 60vmax; height: 60vmax; background: #2b1a5e; top: -20vmax; left: -15vmax; }
  .b2 { width: 50vmax; height: 50vmax; background: #0f3a4d; bottom: -18vmax; right: -12vmax; }
  /* стеклянная карточка с блюром */
  .card {
    position: relative; z-index: 1;
    padding: 40px 56px; border-radius: 28px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  h1 { font-size: clamp(36px, 10vw, 64px); font-weight: 700; letter-spacing: -.02em; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="card"><h1>Привет</h1></div>
  <script>
    try {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#07070b'); tg.setBackgroundColor('#07070b'); }
    } catch (e) {}
  </script>
</body>
</html>
